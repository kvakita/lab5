name: CI (Compose + Integration Tests)

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Show running containers
        run: docker ps -a

      - name: Wait for API Gateway
        run: |
          echo "Containers:"
          docker ps -a

          echo "Ports:"
          docker compose ps

          for i in {1..60}; do
            if curl -sSf http://localhost:8081/health > /dev/null; then
              echo "Gateway is up"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

          echo "=== docker compose logs ==="
          docker compose logs --no-color
          exit 1

      - name: Install Newman
        run: npm i -g newman

      - name: Run Postman integration tests
        run: newman run postman/collection.json -e postman/env.json

      # Если тесты упали — сохраним логи как артефакт
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose-logs.txt
          docker ps -a > artifacts/docker-ps.txt

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts

      - name: Stop stack
        if: always()
        run: docker compose down -v