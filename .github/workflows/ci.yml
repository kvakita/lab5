name: CI (Compose + Integration Tests)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Show running containers
        run: docker ps -a

      - name: Wait for API Gateway to be ready
        run: |
          for i in {1..45}; do
            if curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ok" \
              "http://localhost:8081/api/audit" | grep -qE "200|400"; then
              echo "API Gateway is up"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "API Gateway did not become ready"
          docker compose logs --no-color
          exit 1

      - name: Install Newman
        run: npm i -g newman

      - name: Run Postman integration tests
        run: newman run postman/collection.json -e postman/env.json

      # Если тесты упали — сохраним логи как артефакт
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose-logs.txt
          docker ps -a > artifacts/docker-ps.txt

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts

      - name: Stop stack
        if: always()
        run: docker compose down -v